<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <meta name="theme-color" content="#d2172f" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Gym Tracker</title>
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('theme') || 'light';
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          // Colours derived from a custom background image (see src/background.ts).
          var bg = JSON.parse(localStorage.getItem('bgTokens') || 'null');
          if (bg && bg.theme === document.documentElement.dataset.theme) {
            for (var k in bg.vars) document.documentElement.style.setProperty(k, bg.vars[k]);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
